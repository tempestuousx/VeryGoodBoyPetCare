[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rover-assistant"
version = "0.1.0"
description = "Turn Rover conversations into calendar events, reminders, and prepared follow-up messages."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VeryGoodBoyPetCare" }]
dependencies = []

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.0",
  "google-auth-httplib2>=0.1",
  "google-auth-oauthlib>=1.0",
]

[project.scripts]
rover-assistant = "rover_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["rover_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
